name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: "stable"

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Bundle Pure-Python Packages (Telethon, pyaes, rsa)
        run: |
          pip install --target=./vendor telethon==1.37.0 pyaes rsa pyasn1
          cp -r ./vendor/telethon ./telethon
          cp -r ./vendor/pyaes ./pyaes
          cp -r ./vendor/rsa ./rsa
          cp -r ./vendor/pyasn1 ./pyasn1
          rm -rf ./vendor

      - name: Install Flet & Build APK
        run: |
          pip install flet==0.25.2
          flet build apk --no-rich-output

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TG-Media-Backup-APK
          path: build/apk/*.apk
